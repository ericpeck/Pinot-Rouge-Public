name: CI

# Merge gate for every branch heading into main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow has no repository secrets and must not
# gain write access. Do not switch to pull_request_target.
permissions:
  contents: read
  actions: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Filter engine tests
        run: ./gradlew :core:rules:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Compile androidTest sources
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Production runtime dependency inventory
        run: |
          mkdir -p app/build/reports core/rules/build/reports
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath --console=plain \
            > app/build/reports/debug-runtime-classpath.txt
          ./gradlew :core:rules:dependencies --configuration runtimeClasspath --console=plain \
            > core/rules/build/reports/runtime-classpath.txt
          grep -q 'androidx.room:room-runtime' app/build/reports/debug-runtime-classpath.txt
          grep -q 'androidx.work:work-runtime' app/build/reports/debug-runtime-classpath.txt
          grep -q 'com.google.re2j:re2j' core/rules/build/reports/runtime-classpath.txt
          echo "Inventory includes AndroidX Room, Work, and RE2 (direct + transitive)."

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Assert the filter engine stays Android-free
        run: |
          if grep -rn --include='*.kt' -E '^\s*import\s+(android|androidx)\.' core/rules/src; then
            echo "::error::core/rules must not depend on Android. Pass the value in instead."
            exit 1
          fi
          echo "core/rules is clean."

      - name: Upload runtime dependency inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gradle-runtime-classpath
          path: |
            app/build/reports/debug-runtime-classpath.txt
            core/rules/build/reports/runtime-classpath.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            core/rules/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/debug-runtime-classpath.txt
            core/rules/build/reports/runtime-classpath.txt
          retention-days: 7
          if-no-files-found: ignore
