name: CI

# Merge gate for every branch heading into main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: this workflow has no repository secrets and must not
# gain write access. Do not switch to pull_request_target.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Filter engine tests
        run: ./gradlew :core:rules:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Compile androidTest sources
        run: ./gradlew :app:compileDebugAndroidTestKotlin

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Assert the filter engine stays Android-free
        run: |
          if grep -rn --include='*.kt' -E '^\s*import\s+(android|androidx)\.' core/rules/src; then
            echo "::error::core/rules must not depend on Android. Pass the value in instead."
            exit 1
          fi
          echo "core/rules is clean."

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            core/rules/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          retention-days: 7
          if-no-files-found: ignore
