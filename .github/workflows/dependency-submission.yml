name: Dependency graph

# Submits the resolved Gradle graph to GitHub's dependency submission API
# so Dependabot alerts cover Android/Maven libraries, not only Actions.
#
# Trusted default-branch only. Fork pull requests never run this job and
# never receive contents:write. Dependabot version-update PRs are not
# vulnerability coverage; alerts against this graph are.
#
# Production runtime (direct + transitive) is the intended alert surface.
# testImplementation / androidTestImplementation configurations may also
# appear in the submitted snapshot; treat those as build/test-only.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Submit resolved Gradle dependencies
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          additional-arguments: --no-configuration-cache

      - name: Upload generated dependency snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-dependency-graph
          path: |
            dependency-graph-reports/
          retention-days: 30
          if-no-files-found: warn
